name: Mirror Jerry's verified qBittorrent builds

# Mirror every supported amd64 build in Jerry's manifest. The workflow never compiles
# qBittorrent; it validates a commit-pinned prebuilt binary and its SHA-256.
on:
  schedule:
    - cron: "23 4 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-qbittorrent.yml"
  workflow_dispatch:
    inputs:
      qb_version:
        description: "Optional qBittorrent version filter (leave empty for all supported builds)"
        required: false
        default: ""
      lt_version:
        description: "Optional libtorrent version filter, e.g. 1.2.20 (leave empty for all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: qbittorrent-manifest-mirror-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    env:
      QB_VERSION_FILTER: ${{ github.event.inputs.qb_version || '' }}
      LT_VERSION_FILTER: ${{ github.event.inputs.lt_version || '' }}
    steps:
      - name: Build the amd64 release matrix from Jerry's manifest
        id: matrix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest_url="https://raw.githubusercontent.com/jerry048/Dedicated-Seedbox/main/manifests/qbittorrent.tsv"
          readme_url="https://raw.githubusercontent.com/jerry048/Dedicated-Seedbox/main/Torrent%20Clients/qBittorrent/README.md"
          curl -fsSL --retry 3 --connect-timeout 20 "$manifest_url" -o "$RUNNER_TEMP/qbittorrent.tsv"
          curl -fsSL --retry 3 --connect-timeout 20 "$readme_url" -o "$RUNNER_TEMP/qbittorrent-readme.md"
          python3 - <<'PY'
          import csv
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          manifest = Path(os.environ["RUNNER_TEMP"]) / "qbittorrent.tsv"
          readme = Path(os.environ["RUNNER_TEMP"]) / "qbittorrent-readme.md"
          qb_filter = os.environ.get("QB_VERSION_FILTER", "").strip()
          lt_filter = os.environ.get("LT_VERSION_FILTER", "").strip()
          if bool(qb_filter) != bool(lt_filter):
              raise SystemExit("Set both qb_version and lt_version, or leave both empty.")

          lt_filter = lt_filter.removeprefix("libtorrent-").removeprefix("v")
          lt_filter_field = "1_1_14" if lt_filter == "1.1.14" else ("v" + lt_filter if lt_filter else "")
          patch_match = re.search(
              r"https://github\.com/jerry048/Patch/tree/([0-9a-f]{40})/patches",
              readme.read_text(encoding="utf-8"),
          )
          if not patch_match:
              raise SystemExit("Could not resolve the jerry048/Patch commit pinned by the qBittorrent README.")
          patch_ref = patch_match.group(1)

          matrix = []
          with manifest.open(encoding="utf-8", newline="") as fh:
              for row in csv.reader(fh, delimiter="\t"):
                  if not row or row[0].startswith("#") or len(row) < 7:
                      continue
                  qb, lt_field, arch, source, url, sha, family = row[:7]
                  if arch != "amd64" or source != "static":
                      continue
                  if qb_filter and (qb != qb_filter or lt_field != lt_filter_field):
                      continue
                  match = re.match(
                      r"^https://raw\.githubusercontent\.com/jerry048/Dedicated-Seedbox/([0-9a-f]{40})/",
                      url,
                  )
                  if not match or not re.fullmatch(r"[0-9a-fA-F]{64}", sha):
                      raise SystemExit(f"Invalid pinned source URL or SHA-256 in manifest row: {qb} {lt_field}")
                  if family not in {"legacy_41", "classic_pbkdf2", "modern_pbkdf2"}:
                      raise SystemExit(f"Unknown qBittorrent config family in manifest row: {family}")
                  lt_version = lt_field.removeprefix("v").replace("_", ".")
                  tag = f"release-{qb}_v{lt_version}"
                  checksum_url = (
                      f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
                      f"/releases/download/{tag}/x86_64-qbittorrent-nox.sha256"
                  )
                  current_sha = ""
                  try:
                      with urllib.request.urlopen(checksum_url, timeout=15) as response:
                          current_sha = response.read().decode("utf-8", "replace").split()[0]
                  except Exception:
                      pass
                  matrix.append({
                      "qb_version": qb,
                      "lt_version": lt_version,
                      "lt_manifest": lt_field,
                      "source_url": url,
                      "source_sha256": sha.lower(),
                      "source_ref": match.group(1),
                      "patch_ref": patch_ref,
                      "config_family": family,
                      "publish": current_sha.lower() != sha.lower(),
                  })

          if qb_filter and not matrix:
              raise SystemExit(f"No Jerry static amd64 build found for qBittorrent {qb_filter} + libtorrent {lt_filter}.")
          if not matrix:
              raise SystemExit("No amd64 static builds were found in Jerry's manifest.")
          matrix_json = json.dumps({"include": matrix}, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("matrix=" + matrix_json + "\n")
          print(f"Found {len(matrix)} amd64 build combinations; {sum(x['publish'] for x in matrix)} need publishing.")
          PY

  publish:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    permissions:
      contents: write
    env:
      QB_VERSION: ${{ matrix.qb_version }}
      LT_VERSION: ${{ matrix.lt_version }}
      LT_MANIFEST: ${{ matrix.lt_manifest }}
      SOURCE_URL: ${{ matrix.source_url }}
      SOURCE_SHA256: ${{ matrix.source_sha256 }}
      SOURCE_REF: ${{ matrix.source_ref }}
      PATCH_REF: ${{ matrix.patch_ref }}
      CONFIG_FAMILY: ${{ matrix.config_family }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download and verify Jerry's prebuilt binary
        if: ${{ matrix.publish == true }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -fsSL --retry 3 --connect-timeout 20 "$SOURCE_URL" -o out/x86_64-qbittorrent-nox
          printf '%s  %s\n' "$SOURCE_SHA256" out/x86_64-qbittorrent-nox | sha256sum -c -
          chmod 700 out/x86_64-qbittorrent-nox
          version_output="$(out/x86_64-qbittorrent-nox --version 2>&1)"
          printf '%s\n' "$version_output"
          grep -Fq "qBittorrent v$QB_VERSION" <<<"$version_output" || {
            echo "::error::Prebuilt binary version does not match $QB_VERSION"; exit 1;
          }
          sha256sum out/x86_64-qbittorrent-nox | tee out/x86_64-qbittorrent-nox.sha256
          {
            echo "qBittorrent $QB_VERSION + libtorrent $LT_VERSION, static amd64 (Jerry prebuilt)"
            echo "Source: jerry048/Dedicated-Seedbox@$SOURCE_REF"
            echo "Patch source: jerry048/Patch@$PATCH_REF"
            echo "qBittorrent patch: patches for $QB_VERSION (applied cleanly)"
            echo "libtorrent patch path: patches/libtorrent/$LT_VERSION"
            echo "Config family: $CONFIG_FAMILY"
            echo "Source SHA-256 verified against manifests/qbittorrent.tsv"
          } | tee out/patches-used.txt

      - name: Publish verified release
        if: ${{ matrix.publish == true }}
        shell: bash
        run: |
          set -euo pipefail
          tag="release-${QB_VERSION}_v${LT_VERSION}"
          notes="Mirrored Jerry's static qBittorrent ${QB_VERSION} + libtorrent ${LT_VERSION} amd64 build. SHA-256 verified against the commit-pinned entry in Dedicated-Seedbox/manifests/qbittorrent.tsv. No local compilation was performed."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/* --clobber
            gh release edit "$tag" --title "qBittorrent ${QB_VERSION} + libtorrent ${LT_VERSION} (Jerry prebuilt)" --notes "$notes"
          else
            gh release create "$tag" out/* --title "qBittorrent ${QB_VERSION} + libtorrent ${LT_VERSION} (Jerry prebuilt)" --notes "$notes" --target "$GITHUB_SHA"
          fi
          echo "Published: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$tag"
