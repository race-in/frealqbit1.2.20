name: Mirror Jerry's prebuilt qBittorrent-nox

# Jerry already publishes tested static binaries in Dedicated-Seedbox.
# This workflow verifies and mirrors that artifact; it does not compile Qt/qBittorrent.
# Daily checks publish a new release only when Jerry's manifest checksum changes.

on:
  schedule:
    - cron: "23 4 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-qbittorrent.yml"
  workflow_dispatch:
    inputs:
      qb_version:
        description: "qBittorrent version"
        required: true
        default: "5.3.0"
      lt_version:
        description: "libtorrent version (manifest version)"
        required: true
        default: "1.2.20"

permissions:
  contents: write

# Share the legacy build workflow's concurrency key so a pending/active compile run
# is cancelled as soon as this replacement mirror workflow starts.
concurrency:
  group: build-${{ github.event.inputs.qb_version }}-${{ github.event.inputs.lt_version }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.source.outputs.should_publish }}
      qb_version: ${{ steps.source.outputs.qb_version }}
      lt_version: ${{ steps.source.outputs.lt_version }}
      source_url: ${{ steps.source.outputs.source_url }}
      source_sha256: ${{ steps.source.outputs.source_sha256 }}
      source_ref: ${{ steps.source.outputs.source_ref }}
      patch_ref: ${{ steps.source.outputs.patch_ref }}
    env:
      QB_VERSION: ${{ github.event.inputs.qb_version || '5.3.0' }}
      LT_VERSION: ${{ github.event.inputs.lt_version || '1.2.20' }}
    steps:
      - name: Find verified x86_64 binary in Jerry's manifest
        id: source
        shell: bash
        run: |
          set -euo pipefail
          manifest_url="https://raw.githubusercontent.com/jerry048/Dedicated-Seedbox/main/manifests/qbittorrent.tsv"
          readme_url="https://raw.githubusercontent.com/jerry048/Dedicated-Seedbox/main/Torrent%20Clients/qBittorrent/README.md"
          curl -fsSL --retry 3 --connect-timeout 20 "$manifest_url" -o /tmp/qbittorrent.tsv
          line="$(awk -F '\t' -v qb="$QB_VERSION" -v lt="v$LT_VERSION" '$1==qb && $2==lt && $3=="amd64" && $4=="static" {print; exit}' /tmp/qbittorrent.tsv)"
          [[ -n "$line" ]] || { echo "::error::Jerry's manifest has no static amd64 build for qBittorrent $QB_VERSION + libtorrent $LT_VERSION"; exit 1; }
          IFS=$'\t' read -r version lt_manifest arch source_type url expected_sha family <<< "$line"
          [[ "$expected_sha" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Manifest SHA-256 is invalid"; exit 1; }
          source_ref="$(sed -n 's#^https://raw.githubusercontent.com/jerry048/Dedicated-Seedbox/\([0-9a-f]\{40\}\)/.*#\1#p' <<< "$url")"
          [[ "$source_ref" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Source URL is not commit-pinned"; exit 1; }

          curl -fsSL --retry 3 --connect-timeout 20 "$readme_url" -o /tmp/qbittorrent-readme.md
          patch_ref="$(grep -oE 'https://github.com/jerry048/Patch/tree/[0-9a-f]{40}/patches' /tmp/qbittorrent-readme.md | head -n1 | sed -E 's#^.*/tree/([0-9a-f]{40})/patches$#\1#' || true)"
          [[ "$patch_ref" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Could not find the patch commit pinned by Jerry's build documentation"; exit 1; }

          tag="release-${QB_VERSION}_v${LT_VERSION}"
          release_sum_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/x86_64-qbittorrent-nox.sha256"
          current_sha="$(curl -fsSL --connect-timeout 10 "$release_sum_url" 2>/dev/null | awk 'NR==1 {print $1}' || true)"
          if [[ "$current_sha" == "$expected_sha" ]]; then
            should_publish=false
            echo "Jerry's prebuilt binary is unchanged ($expected_sha); no new release is needed."
          else
            should_publish=true
            echo "A new/missing release is needed. Jerry binary SHA-256: $expected_sha"
          fi

          {
            echo "should_publish=$should_publish"
            echo "qb_version=$QB_VERSION"
            echo "lt_version=$LT_VERSION"
            echo "source_url=$url"
            echo "source_sha256=$expected_sha"
            echo "source_ref=$source_ref"
            echo "patch_ref=$patch_ref"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: discover
    if: needs.discover.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      QB_VERSION: ${{ needs.discover.outputs.qb_version }}
      LT_VERSION: ${{ needs.discover.outputs.lt_version }}
      SOURCE_URL: ${{ needs.discover.outputs.source_url }}
      SOURCE_SHA256: ${{ needs.discover.outputs.source_sha256 }}
      SOURCE_REF: ${{ needs.discover.outputs.source_ref }}
      PATCH_REF: ${{ needs.discover.outputs.patch_ref }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download and verify Jerry's prebuilt binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -fsSL --retry 3 --connect-timeout 20 "$SOURCE_URL" -o out/x86_64-qbittorrent-nox
          printf '%s  %s\n' "$SOURCE_SHA256" out/x86_64-qbittorrent-nox | sha256sum -c -
          chmod 700 out/x86_64-qbittorrent-nox
          version_output="$(out/x86_64-qbittorrent-nox --version 2>&1)"
          printf '%s\n' "$version_output"
          grep -Fq "qBittorrent v$QB_VERSION" <<< "$version_output" || {
            echo "::error::Prebuilt binary version does not match $QB_VERSION"; exit 1;
          }
          sha256sum out/x86_64-qbittorrent-nox | tee out/x86_64-qbittorrent-nox.sha256
          {
            echo "qBittorrent $QB_VERSION + libtorrent $LT_VERSION, static x86_64 (Jerry prebuilt binary)"
            echo "Source: jerry048/Dedicated-Seedbox@$SOURCE_REF"
            echo "jerry048/Patch commit: $PATCH_REF"
            echo "qBittorrent patch : jerry048/Patch $PATCH_REF -> patches for $QB_VERSION (applied cleanly to $QB_VERSION)"
            echo "libtorrent patch  : jerry048/Patch $PATCH_REF -> patches/libtorrent/$LT_VERSION"
            echo "Source SHA-256 verified against Jerry's manifests/qbittorrent.tsv"
          } | tee out/patches-used.txt

      - name: Publish verified release
        shell: bash
        run: |
          set -euo pipefail
          tag="release-${QB_VERSION}_v${LT_VERSION}"
          notes="Mirrored prebuilt qBittorrent ${QB_VERSION} + libtorrent ${LT_VERSION} from jerry048/Dedicated-Seedbox. The binary was verified against Jerry's pinned manifest SHA-256. No local compilation was performed."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/* --clobber
            gh release edit "$tag" --title "qBittorrent ${QB_VERSION} + libtorrent ${LT_VERSION} (Jerry prebuilt)" --notes "$notes"
          else
            gh release create "$tag" out/* --title "qBittorrent ${QB_VERSION} + libtorrent ${LT_VERSION} (Jerry prebuilt)" --notes "$notes" --target "${GITHUB_SHA}"
          fi
          echo "Published: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$tag"
