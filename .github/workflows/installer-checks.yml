name: Installer checks

on:
  push:
    branches: [main]
    paths:
      - "install-qbittorrent.sh"
      - "upgrade-qbittorrent-binary.sh"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "install-qbittorrent.sh"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bash syntax check
        run: |
          bash -n install-qbittorrent.sh
          bash -n upgrade-qbittorrent-binary.sh
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          ignore_paths: .git
